@font-face { font-family: "BVP"; src: url("assets/BeVietnamPro-Bold.ttf"); font-weight: 700; }

.ttext { font-weight: 900; font-size: 84px; line-height: 1.12; color: #fff; text-transform: uppercase; }

.bigword { display: block; font-weight: 900; font-size: 150px; line-height: 1; color: #F5C518; text-align: center;

/* presenter cards */
.photocard .pcbg { position: absolute; inset: 0; background: radial-gradient(100% 70% at 50% 35%, #1B2433 0%, #0B0F14 80%); }
.photocard .pcframe { position: absolute; left: 140px; width: 800px; top: 200px; height: 1200px; border-radius: 44px; overflow: hidden;

.shade { background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%); }
